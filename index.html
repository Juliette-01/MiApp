<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Creator Studio Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b101d] text-slate-100 min-h-screen pb-24 font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0b101d]/90 border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="p-1.5 sm:p-2 bg-brand-600 rounded-xl">
          <i data-lucide="video" class="w-4 h-4 sm:w-5 sm:h-5 text-white"></i>
        </div>
        <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent truncate">
          Creator Studio
        </h1>
      </div>
      
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Exportar / Importar Archivo de Respaldos -->
        <button onclick="exportData()" title="Guardar respaldo en archivo" class="p-1.5 bg-[#171e31] hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-700/60 transition flex items-center gap-1 text-xs">
          <i data-lucide="download" class="w-4 h-4 text-brand-400"></i>
          <span class="hidden md:inline">Exportar</span>
        </button>
        
        <label title="Cargar respaldo desde archivo" class="p-1.5 bg-[#171e31] hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-700/60 transition flex items-center gap-1 text-xs cursor-pointer">
          <i data-lucide="upload" class="w-4 h-4 text-emerald-400"></i>
          <span class="hidden md:inline">Importar</span>
          <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
        </label>

        <!-- Alternar Vista -->
        <div class="bg-[#171e31] p-1 rounded-lg flex border border-slate-700/60">
          <button id="btn-grid" onclick="setViewMode('grid')" class="p-1.5 rounded-md text-slate-400 hover:text-white transition">
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
          </button>
          <button id="btn-list" onclick="setViewMode('list')" class="p-1.5 rounded-md text-slate-400 hover:text-white transition">
            <i data-lucide="list" class="w-4 h-4"></i>
          </button>
        </div>

        <button onclick="openModal()" class="flex items-center gap-1 bg-brand-600 hover:bg-brand-700 text-white px-2.5 sm:px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition shadow-lg shadow-brand-600/20">
          <i data-lucide="plus" class="w-4 h-4"></i> <span class="hidden sm:inline">Nuevo</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-6xl mx-auto px-3 sm:px-4 pt-4 sm:pt-6">
    
    <!-- BARRA DE PROGRESO GENERAL -->
    <div class="mb-6 bg-[#172033] border border-slate-700/50 p-4 rounded-2xl shadow-xl">
      <div class="flex justify-between items-center mb-1.5">
        <div>
          <h2 class="text-sm sm:text-base font-semibold text-white">Progreso General</h2>
          <p id="global-subtitle" class="text-[11px] sm:text-xs text-slate-400">0 de 0 tomas completadas</p>
        </div>
        <span id="global-percentage" class="text-lg sm:text-xl font-bold text-brand-400">0%</span>
      </div>
      <div class="w-full bg-[#0b101d] rounded-full h-2.5 sm:h-3 overflow-hidden border border-slate-700/50">
        <div id="global-progress-bar" class="bg-gradient-to-r from-violet-500 via-fuchsia-500 to-pink-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- Contenedor de Tarjetas de Proyectos -->
    <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
  </main>

  <!-- Ventana Modal (Agregar / Editar Proyecto) -->
  <div id="project-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#172033] border border-slate-700/60 rounded-t-2xl sm:rounded-2xl p-5 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
      <h2 id="modal-title" class="text-lg sm:text-xl font-bold mb-4 text-white">Nuevo Proyecto</h2>
      
      <input type="hidden" id="edit-project-id">
      
      <div class="space-y-3.5">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nombre del Proyecto / Video</label>
          <input type="text" id="project-title" placeholder="Ej. Colocando botas" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-brand-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">URL del Video (MP4 / Web)</label>
          <input type="url" id="project-video-url" placeholder="https://ejemplo.com/video.mp4" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-xs sm:text-sm">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">O archivo local (MP4)</label>
          <input type="file" id="project-video-file" accept="video/mp4,video/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-600 file:text-white hover:file:bg-brand-700 cursor-pointer">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Tomas requeridas para este proyecto (Separadas por comas)</label>
          <textarea id="project-tasks" rows="3" placeholder="Toma principal, Angulo cerrado, Camara lenta" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-xs sm:text-sm"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-5">
        <button onclick="closeModal()" class="px-4 py-2 text-xs sm:text-sm text-slate-400 hover:text-white">Cancelar</button>
        <button onclick="saveProject()" class="px-4 py-2 text-xs sm:text-sm bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script>
    let projects = JSON.parse(localStorage.getItem('juls_creator_projects')) || [];
    let viewMode = localStorage.getItem('juls_creator_view') || 'grid';

    function saveToStorage() {
      localStorage.setItem('juls_creator_projects', JSON.stringify(projects));
      renderProjects();
    }

    function setViewMode(mode) {
      viewMode = mode;
      localStorage.setItem('juls_creator_view', mode);
      renderProjects();
    }

    function exportData() {
      if (projects.length === 0) return alert('No tienes proyectos para exportar.');
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `creator_studio_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedProjects = JSON.parse(e.target.result);
          if (Array.isArray(importedProjects)) {
            projects = importedProjects;
            saveToStorage();
            alert('¡Proyectos cargados correctamente!');
          } else {
            alert('El archivo cargado no tiene un formato válido.');
          }
        } catch (err) {
          alert('Ocurrió un error al leer el archivo de respaldo.');
        }
      };
      reader.readAsText(file);
    }

    function openModal(projectId = null) {
      const modal = document.getElementById('project-modal');
      const title = document.getElementById('modal-title');
      const inputId = document.getElementById('edit-project-id');
      const inputTitle = document.getElementById('project-title');
      const inputUrl = document.getElementById('project-video-url');
      const inputTasks = document.getElementById('project-tasks');
      const videoInputFile = document.getElementById('project-video-file');

      videoInputFile.value = '';

      if (projectId) {
        const project = projects.find(p => p.id === projectId);
        if (project) {
          title.innerText = "Editar Proyecto";
          inputId.value = project.id;
          inputTitle.value = project.title;
          inputUrl.value = project.videoUrl && !project.videoUrl.startsWith('data:') ? project.videoUrl : '';
          inputTasks.value = project.tasks ? project.tasks.map(t => t.text).join(', ') : '';
        }
      } else {
        title.innerText = "Nuevo Proyecto";
        inputId.value = '';
        inputTitle.value = '';
        inputUrl.value = '';
        inputTasks.value = '';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('project-modal').classList.add('hidden');
    }

    function saveProject() {
      const id = document.getElementById('edit-project-id').value;
      const title = document.getElementById('project-title').value.trim();
      const videoUrl = document.getElementById('project-video-url').value.trim();
      const tasksText = document.getElementById('project-tasks').value;
      const fileInput = document.getElementById('project-video-file');

      if (!title) return alert('Por favor escribe un título para el proyecto.');

      const newTasksList = tasksText.split(',')
        .map(t => t.trim())
        .filter(t => t.length > 0);

      const processSave = (finalVideoSrc) => {
        if (id) {
          const project = projects.find(p => p.id === id);
          if (project) {
            project.title = title;
            if (newTasksList.length > 0) {
              project.tasks = newTasksList.map(taskText => {
                const existingTask = project.tasks ? project.tasks.find(t => t.text === taskText) : null;
                return existingTask ? existingTask : { text: taskText, completed: false };
              });
            }
            if (finalVideoSrc !== undefined) project.videoUrl = finalVideoSrc;
          }
        } else {
          projects.push({
            id: Date.now().toString(),
            title: title,
            videoUrl: finalVideoSrc || '',
            tasks: newTasksList.length > 0 
              ? newTasksList.map(t => ({ text: t, completed: false }))
              : [{ text: 'Toma principal', completed: false }]
          });
        }

        saveToStorage();
        closeModal();
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          processSave(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        processSave(videoUrl || undefined);
      }
    }

    function toggleTask(projectId, taskIndex) {
      const project = projects.find(p => p.id === projectId);
      if (project && project.tasks && project.tasks[taskIndex]) {
        project.tasks[taskIndex].completed = !project.tasks[taskIndex].completed;
        saveToStorage();
      }
    }

    function deleteProject(id) {
      if (confirm('¿Segura que quieres eliminar este proyecto?')) {
        projects = projects.filter(p => p.id !== id);
        saveToStorage();
      }
    }

    function renderProjects() {
      const container = document.getElementById('projects-container');
      const btnGrid = document.getElementById('btn-grid');
      const btnList = document.getElementById('btn-list');

      // 1. PROGRESO GLOBAL
      let totalGlobalTasks = 0;
      let completedGlobalTasks = 0;

      projects.forEach(p => {
        if (p.tasks) {
          totalGlobalTasks += p.tasks.length;
          completedGlobalTasks += p.tasks.filter(t => t.completed).length;
        }
      });

      const globalPercentage = totalGlobalTasks > 0 ? Math.round((completedGlobalTasks / totalGlobalTasks) * 100) : 0;

      document.getElementById('global-percentage').innerText = `${globalPercentage}%`;
      document.getElementById('global-progress-bar').style.width = `${globalPercentage}%`;
      document.getElementById('global-subtitle').innerText = `${completedGlobalTasks} de ${totalGlobalTasks} tomas completadas`;

      // 2. CONFIGURACIÓN DE VISTAS
      if (viewMode === 'grid') {
        container.className = "grid grid-cols-1 md:grid-cols-2 gap-5";
        btnGrid.className = "p-1.5 rounded-md bg-brand-600 text-white transition";
        btnList.className = "p-1.5 rounded-md text-slate-400 hover:text-white transition";
      } else {
        container.className = "flex flex-col gap-4";
        btnGrid.className = "p-1.5 rounded-md text-slate-400 hover:text-white transition";
        btnList.className = "p-1.5 rounded-md bg-brand-600 text-white transition";
      }

      container.innerHTML = '';

      if (projects.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 bg-[#172033]/50 border border-slate-800 rounded-2xl">
            <i data-lucide="clapperboard" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
            <p class="text-xs sm:text-sm text-slate-400">No tienes proyectos agregados aún.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // RENDERIZADO FIEL AL DISEÑO ADJUNTADO
      projects.forEach(p => {
        const card = document.createElement('div');
        card.className = "bg-[#172033] border border-slate-700/50 rounded-2xl p-4 sm:p-5 shadow-xl flex flex-col justify-between";

        card.innerHTML = `
          <div>
            <!-- Header de la tarjeta del proyecto -->
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-lg text-white truncate pr-2">${p.title}</h3>
              <div class="flex items-center gap-2">
                <button onclick="openModal('${p.id}')" title="Editar" class="text-slate-400 hover:text-white transition">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button onclick="deleteProject('${p.id}')" title="Eliminar" class="text-slate-400 hover:text-rose-400 transition">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Contenedor del video con dimensiones exactas -->
            ${p.videoUrl ? `
              <div class="rounded-2xl overflow-hidden bg-black mb-4 flex items-center justify-center border border-slate-900/80 shadow-inner">
                <video src="${p.videoUrl}" controls class="w-full max-h-[300px] object-contain"></video>
              </div>
            ` : ''}

            <!-- Checklist / Tomas pertenecientes a este proyecto -->
            <div>
              <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">TOMAS / CHECKLIST</p>
              <div class="space-y-2">
                ${p.tasks ? p.tasks.map((task, idx) => `
                  <div onclick="toggleTask('${p.id}',${idx})" class="flex items-center justify-between p-2.5 rounded-xl bg-[#0b101d]/60 hover:bg-[#0b101d] transition cursor-pointer border border-slate-800/80">
                    <span class="text-xs sm:text-sm ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${task.text}</span>
                    <div class="w-5 h-5 rounded-md border ${task.completed ? 'bg-brand-600 border-brand-500 flex items-center justify-center' : 'border-slate-600/80'}">
                      ${task.completed ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}
                    </div>
                  </div>
                `).join('') : ''}
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    renderProjects();
  </script>
</body>
</html>
