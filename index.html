<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Creator Studio Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b101d] text-slate-100 min-h-screen pb-24 font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header Fijo -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0b101d]/90 border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="p-1.5 sm:p-2 bg-brand-600 rounded-xl cursor-pointer" onclick="switchTab('all')">
          <i data-lucide="video" class="w-4 h-4 sm:w-5 sm:h-5 text-white"></i>
        </div>
        <h1 onclick="switchTab('all')" class="text-lg sm:text-xl font-bold bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent truncate cursor-pointer">
          Creator Studio
        </h1>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="exportData()" title="Guardar respaldo" class="p-1.5 bg-[#171e31] hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-700/60 transition flex items-center gap-1 text-xs">
          <i data-lucide="download" class="w-4 h-4 text-brand-400"></i>
          <span class="hidden md:inline">Exportar</span>
        </button>
        
        <label title="Cargar respaldo" class="p-1.5 bg-[#171e31] hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-700/60 transition flex items-center gap-1 text-xs cursor-pointer">
          <i data-lucide="upload" class="w-4 h-4 text-emerald-400"></i>
          <span class="hidden md:inline">Importar</span>
          <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
        </label>

        <button id="btn-primary-action" onclick="handlePrimaryAction()" class="flex items-center gap-1 bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition shadow-lg shadow-brand-600/20">
          <i data-lucide="plus" class="w-4 h-4"></i> <span id="lbl-primary-action">Agregar Video</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BARRA DE PESTAÑAS -->
  <nav class="bg-[#111827]/80 border-b border-slate-800 px-4 py-2 overflow-x-auto">
    <div id="tabs-bar" class="max-w-6xl mx-auto flex items-center gap-2"></div>
  </nav>

  <!-- Contenedor Principal -->
  <main class="max-w-6xl mx-auto px-3 sm:px-4 pt-4 sm:pt-6">
    
    <!-- BARRA DE PROGRESO DEL PROYECTO ACTUAL -->
    <div class="mb-6 bg-[#172033] border border-slate-700/50 p-4 rounded-2xl shadow-xl">
      <div class="flex justify-between items-center mb-1.5">
        <div>
          <h2 id="progress-title" class="text-sm sm:text-base font-semibold text-white">Progreso del Proyecto</h2>
          <p id="global-subtitle" class="text-[11px] sm:text-xs text-slate-400">0 de 0 tomas completadas</p>
        </div>
        <span id="global-percentage" class="text-lg sm:text-xl font-bold text-brand-400">0%</span>
      </div>
      <div class="w-full bg-[#0b101d] rounded-full h-2.5 sm:h-3 overflow-hidden border border-slate-700/50">
        <div id="global-progress-bar" class="bg-gradient-to-r from-violet-500 via-fuchsia-500 to-pink-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- VISTA PRINCIPAL: VIDEOS DEL PROYECTO SELECCIONADO -->
    <div id="view-project-details">
      <div class="flex items-center justify-between mb-5">
        <h2 id="active-project-title" class="font-bold text-xl text-white"></h2>
        <button onclick="openProjectModal(activeTab)" title="Editar Nombre del Proyecto" class="flex items-center gap-1 text-xs text-slate-400 hover:text-white bg-[#172033] px-3 py-1.5 rounded-lg border border-slate-700/50 transition">
          <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Renombrar Proyecto
        </button>
      </div>

      <div id="videos-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </div>

    <!-- VISTA SECUNDARIA: TODOS LOS PROYECTOS -->
    <div id="view-all-projects" class="hidden">
      <div class="flex items-center justify-between mb-5">
        <h2 class="font-bold text-xl text-white">Todos los Proyectos</h2>
        <button onclick="openProjectModal()" class="flex items-center gap-1 text-xs bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg transition font-medium">
          <i data-lucide="folder-plus" class="w-4 h-4"></i> Crear Nuevo Proyecto
        </button>
      </div>
      <div id="all-projects-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5"></div>
    </div>

  </main>

  <!-- Modal 1: Nuevo / Editar Proyecto -->
  <div id="project-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-[#172033] border border-slate-700/60 rounded-2xl p-5 w-full max-w-md shadow-2xl">
      <h2 id="project-modal-title" class="text-lg font-bold mb-4 text-white">Nuevo Proyecto</h2>
      <input type="hidden" id="edit-project-id">
      <div class="mb-4">
        <label class="block text-xs text-slate-400 mb-1">Nombre del Proyecto</label>
        <input type="text" id="project-name-input" placeholder="Ej. Campaña Calzado / Reseñas TikTok" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-brand-500">
      </div>
      <div class="flex justify-end gap-3">
        <button onclick="closeProjectModal()" class="px-4 py-2 text-xs text-slate-400 hover:text-white">Cancelar</button>
        <button onclick="saveProjectGroup()" class="px-4 py-2 text-xs bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium">Guardar Proyecto</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Nuevo / Editar Video & Tomas -->
  <div id="video-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#172033] border border-slate-700/60 rounded-t-2xl sm:rounded-2xl p-5 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
      <h2 id="video-modal-title" class="text-lg font-bold mb-4 text-white">Agregar Video</h2>
      
      <input type="hidden" id="edit-video-id">
      
      <div class="space-y-3.5">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Título del Video / Escena</label>
          <input type="text" id="video-title-input" placeholder="Ej. Colocando botas / Caminando" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-brand-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">URL del Video (MP4 / Web)</label>
          <input type="url" id="video-url-input" placeholder="https://ejemplo.com/video.mp4" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-xs sm:text-sm">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">O cargar video local (MP4)</label>
          <input type="file" id="video-file-input" accept="video/mp4,video/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-600 file:text-white hover:file:bg-brand-700 cursor-pointer">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Tomas / Especificaciones (Separadas por comas)</label>
          <textarea id="video-tasks-input" rows="3" placeholder="Toma principal, Ángulo cerrado, Detalle calzado (Si se deja vacío, se creará una casilla general para el video)" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-xs sm:text-sm"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-5">
        <button onclick="closeVideoModal()" class="px-4 py-2 text-xs sm:text-sm text-slate-400 hover:text-white">Cancelar</button>
        <button onclick="saveVideo()" class="px-4 py-2 text-xs sm:text-sm bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium">Guardar Video</button>
      </div>
    </div>
  </div>

  <script>
    let mainProjects = JSON.parse(localStorage.getItem('juls_creator_main_projects')) || [
      {
        id: 'proj-1',
        name: 'Disfraz calavera',
        videos: [
          {
            id: 'v1',
            title: 'Colocando zapatos',
            videoUrl: '',
            tasks: [{ text: 'Completado', completed: false }]
          }
        ]
      }
    ];

    let activeTab = mainProjects.length > 0 ? mainProjects[0].id : 'all';

    function saveToStorage() {
      localStorage.setItem('juls_creator_main_projects', JSON.stringify(mainProjects));
      renderApp();
    }

    function switchTab(tabId) {
      activeTab = tabId;
      renderApp();
    }

    function handlePrimaryAction() {
      if (activeTab === 'all') {
        openProjectModal();
      } else {
        openVideoModal(null);
      }
    }

    function openProjectModal(id = null) {
      document.getElementById('edit-project-id').value = id || '';
      document.getElementById('project-name-input').value = '';

      if (id) {
        const proj = mainProjects.find(p => p.id === id);
        if (proj) {
          document.getElementById('project-modal-title').innerText = "Editar Proyecto";
          document.getElementById('project-name-input').value = proj.name;
        }
      } else {
        document.getElementById('project-modal-title').innerText = "Nuevo Proyecto";
      }

      document.getElementById('project-modal').classList.remove('hidden');
    }

    function closeProjectModal() {
      document.getElementById('project-modal').classList.add('hidden');
    }

    function saveProjectGroup() {
      const id = document.getElementById('edit-project-id').value;
      const name = document.getElementById('project-name-input').value.trim();

      if (!name) return alert('Escribe un nombre para el proyecto.');

      if (id) {
        const proj = mainProjects.find(p => p.id === id);
        if (proj) proj.name = name;
      } else {
        const newProj = { id: Date.now().toString(), name: name, videos: [] };
        mainProjects.push(newProj);
        activeTab = newProj.id;
      }

      saveToStorage();
      closeProjectModal();
    }

    function deleteProjectGroup(id, e) {
      if (e) e.stopPropagation();
      if (confirm('¿Segura que quieres eliminar este proyecto completo y sus videos?')) {
        mainProjects = mainProjects.filter(p => p.id !== id);
        activeTab = mainProjects.length > 0 ? mainProjects[0].id : 'all';
        saveToStorage();
      }
    }

    function openVideoModal(videoId = null) {
      document.getElementById('edit-video-id').value = videoId || '';
      document.getElementById('video-title-input').value = '';
      document.getElementById('video-url-input').value = '';
      document.getElementById('video-tasks-input').value = '';
      document.getElementById('video-file-input').value = '';

      if (videoId) {
        const proj = mainProjects.find(p => p.id === activeTab);
        const vid = proj ? proj.videos.find(v => v.id === videoId) : null;
        if (vid) {
          document.getElementById('video-modal-title').innerText = "Editar Video";
          document.getElementById('video-title-input').value = vid.title;
          document.getElementById('video-url-input').value = vid.videoUrl && !vid.videoUrl.startsWith('data:') ? vid.videoUrl : '';
          document.getElementById('video-tasks-input').value = vid.tasks ? vid.tasks.map(t => t.text).join(', ') : '';
        }
      } else {
        document.getElementById('video-modal-title').innerText = "Agregar Video al Proyecto";
      }

      document.getElementById('video-modal').classList.remove('hidden');
    }

    function closeVideoModal() {
      document.getElementById('video-modal').classList.add('hidden');
    }

    function saveVideo() {
      const vidId = document.getElementById('edit-video-id').value;
      const title = document.getElementById('video-title-input').value.trim();
      const videoUrl = document.getElementById('video-url-input').value.trim();
      const tasksText = document.getElementById('video-tasks-input').value.trim();
      const fileInput = document.getElementById('video-file-input');

      if (!title) return alert('Escribe un título para el video.');

      // Si no escribe tomas específicas, se asigna una toma por defecto para habilitar el check
      let rawTasksList = tasksText.length > 0 
        ? tasksText.split(',').map(t => t.trim()).filter(t => t.length > 0)
        : ['Completado'];

      const processSave = (finalSrc) => {
        const proj = mainProjects.find(p => p.id === activeTab);
        if (!proj) return;

        if (vidId) {
          const vid = proj.videos.find(v => v.id === vidId);
          if (vid) {
            vid.title = title;
            vid.tasks = rawTasksList.map(taskText => {
              const existing = vid.tasks ? vid.tasks.find(t => t.text === taskText) : null;
              return existing ? existing : { text: taskText, completed: false };
            });
            if (finalSrc !== undefined) vid.videoUrl = finalSrc;
          }
        } else {
          proj.videos.push({
            id: Date.now().toString(),
            title: title,
            videoUrl: finalSrc || '',
            tasks: rawTasksList.map(t => ({ text: t, completed: false }))
          });
        }

        saveToStorage();
        closeVideoModal();
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          processSave(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        processSave(videoUrl || undefined);
      }
    }

    function toggleTask(vidId, taskIndex) {
      const proj = mainProjects.find(p => p.id === activeTab);
      if (proj) {
        const vid = proj.videos.find(v => v.id === vidId);
        if (vid && vid.tasks && vid.tasks[taskIndex] !== undefined) {
          vid.tasks[taskIndex].completed = !vid.tasks[taskIndex].completed;
          saveToStorage();
        }
      }
    }

    function deleteVideo(vidId) {
      if (confirm('¿Segura que quieres eliminar este video?')) {
        const proj = mainProjects.find(p => p.id === activeTab);
        if (proj) {
          proj.videos = proj.videos.filter(v => v.id !== vidId);
          saveToStorage();
        }
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mainProjects, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `creator_studio_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            mainProjects = imported;
            activeTab = mainProjects.length > 0 ? mainProjects[0].id : 'all';
            saveToStorage();
            alert('¡Datos importados con éxito!');
          }
        } catch (err) {
          alert('Error al leer el archivo.');
        }
      };
      reader.readAsText(file);
    }

    function renderApp() {
      // Garantizar que los vídeos existentes tengan al menos una toma para el check
      mainProjects.forEach(p => {
        if (p.videos) {
          p.videos.forEach(v => {
            if (!v.tasks || !Array.isArray(v.tasks) || v.tasks.length === 0) {
              v.tasks = [{ text: 'Completado', completed: false }];
            }
          });
        }
      });

      // 1. Renderizar Pestañas
      const tabsBar = document.getElementById('tabs-bar');
      tabsBar.innerHTML = '';

      mainProjects.forEach(proj => {
        tabsBar.innerHTML += `
          <button onclick="switchTab('${proj.id}')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 ${activeTab === proj.id ? 'bg-brand-600 text-white shadow-md shadow-brand-600/20' : 'bg-[#172033] text-slate-400 hover:text-white'}">
            📁 ${proj.name}
          </button>
        `;
      });

      tabsBar.innerHTML += `
        <button onclick="switchTab('all')" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${activeTab === 'all' ? 'bg-brand-600 text-white shadow-md shadow-brand-600/20' : 'bg-[#172033] text-slate-400 hover:text-white'}">
          🗂️ Ver Todos los Proyectos
        </button>
      `;

      const projectView = document.getElementById('view-project-details');
      const allView = document.getElementById('view-all-projects');
      const lblAction = document.getElementById('lbl-primary-action');

      if (activeTab !== 'all') {
        // --- VISTA DETALLE DEL PROYECTO SELECCIONADO ---
        lblAction.innerText = "Agregar Video";
        projectView.classList.remove('hidden');
        allView.classList.add('hidden');

        const activeProj = mainProjects.find(p => p.id === activeTab);
        if (!activeProj) {
          if (mainProjects.length > 0) return switchTab(mainProjects[0].id);
          else return switchTab('all');
        }

        document.getElementById('active-project-title').innerText = activeProj.name;

        let projTotal = 0;
        let projDone = 0;
        activeProj.videos.forEach(v => {
          if (v.tasks) {
            projTotal += v.tasks.length;
            projDone += v.tasks.filter(t => t.completed).length;
          }
        });

        const projProg = projTotal > 0 ? Math.round((projDone / projTotal) * 100) : 0;
        document.getElementById('progress-title').innerText = `Progreso: ${activeProj.name}`;
        document.getElementById('global-percentage').innerText = `${projProg}%`;
        document.getElementById('global-progress-bar').style.width = `${projProg}%`;
        document.getElementById('global-subtitle').innerText = `${projDone} de ${projTotal} tomas completadas`;

        const vGrid = document.getElementById('videos-grid');
        vGrid.innerHTML = '';

        if (activeProj.videos.length === 0) {
          vGrid.innerHTML = `
            <div class="col-span-full text-center py-12 bg-[#172033]/50 border border-slate-800 rounded-2xl">
              <i data-lucide="clapperboard" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
              <p class="text-xs sm:text-sm text-slate-400">No hay videos agregados a este proyecto. Haz clic en "Agregar Video" arriba.</p>
            </div>
          `;
        } else {
          activeProj.videos.forEach(v => {
            const vCard = document.createElement('div');
            vCard.className = "bg-[#172033] border border-slate-700/50 rounded-2xl p-4 sm:p-5 shadow-xl flex flex-col justify-between";

            // Generar la lista de casillas de verificación
            const tasksHtml = `
              <div class="space-y-2 mt-3 border-t border-slate-800/80 pt-3">
                ${v.tasks.map((task, idx) => `
                  <div onclick="toggleTask('${v.id}',${idx})" class="flex items-center justify-between p-2.5 rounded-xl bg-[#0b101d]/70 hover:bg-[#0b101d] transition cursor-pointer border border-slate-800/80 group">
                    <span class="text-xs sm:text-sm ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${task.text}</span>
                    <div class="w-6 h-6 min-w-[24px] rounded-lg border transition-all flex items-center justify-center ${task.completed ? 'bg-brand-600 border-brand-500 text-white' : 'border-slate-600 bg-slate-900/80 group-hover:border-slate-400'}">
                      ${task.completed ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            `;

            vCard.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-3">
                  <h3 class="font-bold text-lg text-white truncate pr-2">${v.title}</h3>
                  <div class="flex items-center gap-2">
                    <button onclick="openVideoModal('${v.id}')" title="Editar Video" class="text-slate-400 hover:text-white transition">
                      <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button onclick="deleteVideo('${v.id}')" title="Eliminar Video" class="text-slate-400 hover:text-rose-400 transition">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

                ${v.videoUrl ? `
                  <div class="rounded-2xl overflow-hidden bg-black mb-3 flex items-center justify-center border border-slate-900/80 shadow-inner">
                    <video src="${v.videoUrl}" controls class="w-full max-h-[280px] object-contain"></video>
                  </div>
                ` : ''}

                ${tasksHtml}
              </div>
            `;
            vGrid.appendChild(vCard);
          });
        }

      } else {
        // --- VISTA LISTADO DE TODOS LOS PROYECTOS ---
        lblAction.innerText = "Nuevo Proyecto";
        projectView.classList.add('hidden');
        allView.classList.remove('hidden');

        let totalGlobalTasks = 0;
        let completedGlobalTasks = 0;

        mainProjects.forEach(proj => {
          proj.videos.forEach(v => {
            if (v.tasks) {
              totalGlobalTasks += v.tasks.length;
              completedGlobalTasks += v.tasks.filter(t => t.completed).length;
            }
          });
        });

        document.getElementById('progress-title').innerText = "Progreso Global del Canal";
        const globalPercentage = totalGlobalTasks > 0 ? Math.round((completedGlobalTasks / totalGlobalTasks) * 100) : 0;
        document.getElementById('global-percentage').innerText = `${globalPercentage}%`;
        document.getElementById('global-progress-bar').style.width = `${globalPercentage}%`;
        document.getElementById('global-subtitle').innerText = `${completedGlobalTasks} de ${totalGlobalTasks} tomas completadas`;

        const allGrid = document.getElementById('all-projects-grid');
        allGrid.innerHTML = '';

        if (mainProjects.length === 0) {
          allGrid.innerHTML = `
            <div class="col-span-full text-center py-12 bg-[#172033]/50 border border-slate-800 rounded-2xl">
              <i data-lucide="folder-open" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
              <p class="text-xs sm:text-sm text-slate-400">No hay proyectos. Haz clic en "Crear Nuevo Proyecto".</p>
            </div>
          `;
        } else {
          mainProjects.forEach(proj => {
            let pTotal = 0;
            let pDone = 0;
            proj.videos.forEach(v => {
              if (v.tasks) {
                pTotal += v.tasks.length;
                pDone += v.tasks.filter(t => t.completed).length;
              }
            });
            const pProg = pTotal > 0 ? Math.round((pDone / pTotal) * 100) : 0;

            const card = document.createElement('div');
            card.className = "bg-[#172033] border border-slate-700/50 hover:border-brand-500/50 rounded-2xl p-5 shadow-xl transition cursor-pointer flex flex-col justify-between";
            card.onclick = () => switchTab(proj.id);

            card.innerHTML = `
              <div>
                <div class="flex items-center justify-between mb-3">
                  <div class="p-2 bg-brand-600/20 rounded-xl">
                    <i data-lucide="folder" class="w-6 h-6 text-brand-400"></i>
                  </div>
                  <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                    <button onclick="openProjectModal('${proj.id}')" title="Editar Nombre" class="p-1.5 text-slate-400 hover:text-white">
                      <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button onclick="deleteProjectGroup('${proj.id}', event)" title="Eliminar Proyecto" class="p-1.5 text-slate-400 hover:text-rose-400">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

                <h3 class="font-bold text-lg text-white mb-1 truncate">${proj.name}</h3>
                <p class="text-xs text-slate-400 mb-4">${proj.videos.length} videos en este proyecto</p>

                <div class="w-full bg-[#0b101d] rounded-full h-2 overflow-hidden border border-slate-800">
                  <div class="bg-gradient-to-r from-violet-500 to-fuchsia-500 h-2 rounded-full" style="width: ${pProg}%"></div>
                </div>
              </div>
            `;
            allGrid.appendChild(card);
          });
        }
      }

      lucide.createIcons();
    }

    renderApp();
  </script>
</body>
</html>
