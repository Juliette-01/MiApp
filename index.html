<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Studio Hub - Auto Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 font-sans antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="p-2 bg-brand-600 rounded-xl">
          <i data-lucide="video" class="w-5 h-5 text-white"></i>
        </div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">
          Creator Studio
        </h1>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- Sync Indicator -->
        <div id="sync-status" class="flex items-center gap-1.5 text-xs text-emerald-400 bg-emerald-950/50 px-2.5 py-1 rounded-full border border-emerald-800">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Sincronizado</span>
        </div>

        <!-- View Toggle Buttons -->
        <div class="bg-slate-800 p-1 rounded-lg flex border border-slate-700">
          <button id="btn-grid" onclick="setViewMode('grid')" class="p-1.5 rounded-md text-slate-400 hover:text-white transition">
            <i data-lucide="layout-grid" class="w-4 h-4"></i>
          </button>
          <button id="btn-list" onclick="setViewMode('list')" class="p-1.5 rounded-md text-slate-400 hover:text-white transition">
            <i data-lucide="list" class="w-4 h-4"></i>
          </button>
        </div>

        <button onclick="openModal()" class="flex items-center gap-1.5 bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-lg shadow-brand-600/20">
          <i data-lucide="plus" class="w-4 h-4"></i> Nuevo
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 pt-6">
    <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </main>

  <!-- Modal Add/Edit Project -->
  <div id="project-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-lg shadow-2xl">
      <h2 id="modal-title" class="text-xl font-bold mb-4 text-white">Nuevo Proyecto</h2>
      <input type="hidden" id="edit-project-id">
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nombre del Proyecto</label>
          <input type="text" id="project-title" placeholder="Ej. Reseña Cafetería Aesthetic" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Cargar Video de Referencia (MP4 / Móvil)</label>
          <input type="file" id="project-video-file" accept="video/mp4,video/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-600 file:text-white hover:file:bg-brand-700 cursor-pointer">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Tomas / Checklist (Separadas por comas)</label>
          <textarea id="project-tasks" rows="3" placeholder="Tomas del café, Fachada lugar, Outfit check, Calificación final" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-sm"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-6">
        <button onclick="closeModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancelar</button>
        <button onclick="saveProject()" class="px-4 py-2 text-sm bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium">Guardar Proyecto</button>
      </div>
    </div>
  </div>

  <script>
    // Configuración de Supabase (REEMPLAZA ESTOS DOS VALORES CON LOS TUYOS)
    const SUPABASE_URL = "TU_SUPABASE_URL";
    const SUPABASE_KEY = "TU_SUPABASE_ANON_KEY";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let projects = [];
    let viewMode = localStorage.getItem('juls_creator_view') || 'grid';

    // Cargar datos en tiempo real
    async function fetchProjects() {
      const { data, error } = await db.from('projects').select('*').order('updated_at', { ascending: false });
      if (!error && data) {
        projects = data;
        renderProjects();
      }
    }

    // Escuchar cambios automáticos desde otros dispositivos
    db.channel('public:projects')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, payload => {
        fetchProjects();
      })
      .subscribe();

    function setViewMode(mode) {
      viewMode = mode;
      localStorage.getItem('juls_creator_view', mode);
      renderProjects();
    }

    function openModal(projectId = null) {
      const modal = document.getElementById('project-modal');
      const title = document.getElementById('modal-title');
      const inputId = document.getElementById('edit-project-id');
      const inputTitle = document.getElementById('project-title');
      const inputTasks = document.getElementById('project-tasks');

      if (projectId) {
        const project = projects.find(p => p.id === projectId);
        title.innerText = "Editar Proyecto";
        inputId.value = project.id;
        inputTitle.value = project.title;
        inputTasks.value = project.tasks.map(t => t.text).join(', ');
      } else {
        title.innerText = "Nuevo Proyecto";
        inputId.value = '';
        inputTitle.value = '';
        inputTasks.value = '';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('project-modal').classList.add('hidden');
    }

    async function saveProject() {
      const id = document.getElementById('edit-project-id').value;
      const title = document.getElementById('project-title').value.trim();
      const tasksText = document.getElementById('project-tasks').value;
      const fileInput = document.getElementById('project-video-file');

      if (!title) return alert('Ingresa un título para el proyecto');

      const tasksList = tasksText.split(',')
        .map(t => t.trim())
        .filter(t => t.length > 0)
        .map(t => ({ text: t, completed: false }));

      const projectId = id || Date.now().toString();

      const handleSave = async (videoSrc = null) => {
        const payload = {
          id: projectId,
          title: title,
          tasks: tasksList.length > 0 ? tasksList : [{ text: 'Toma 1', completed: false }],
          updated_at: new Date()
        };

        if (videoSrc) payload.video_url = videoSrc;

        await db.from('projects').upsert(payload);
        closeModal();
        fetchProjects();
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          handleSave(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        handleSave();
      }
    }

    async function toggleTask(projectId, taskIndex) {
      const project = projects.find(p => p.id === projectId);
      if (project) {
        project.tasks[taskIndex].completed = !project.tasks[taskIndex].completed;
        await db.from('projects').upsert({
          id: project.id,
          tasks: project.tasks,
          updated_at: new Date()
        });
        fetchProjects();
      }
    }

    async function deleteProject(id) {
      if (confirm('¿Eliminar este proyecto?')) {
        await db.from('projects').delete().eq('id', id);
        fetchProjects();
      }
    }

    function renderProjects() {
      const container = document.getElementById('projects-container');
      const btnGrid = document.getElementById('btn-grid');
      const btnList = document.getElementById('btn-list');

      if (viewMode === 'grid') {
        container.className = "grid grid-cols-1 md:grid-cols-2 gap-6";
        btnGrid.className = "p-1.5 rounded-md bg-brand-600 text-white transition";
        btnList.className = "p-1.5 rounded-md text-slate-400 hover:text-white transition";
      } else {
        container.className = "flex flex-col gap-4";
        btnGrid.className = "p-1.5 rounded-md text-slate-400 hover:text-white transition";
        btnList.className = "p-1.5 rounded-md bg-brand-600 text-white transition";
      }

      container.innerHTML = '';

      if (projects.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-800/40 border border-slate-800 rounded-2xl">
            <i data-lucide="clapperboard" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
            <p class="text-slate-400">No tienes proyectos agregados aún.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      projects.forEach(p => {
        const completedCount = p.tasks ? p.tasks.filter(t => t.completed).length : 0;
        const progress = p.tasks && p.tasks.length ? Math.round((completedCount / p.tasks.length) * 100) : 0;

        const card = document.createElement('div');
        card.className = `bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 flex flex-col justify-between shadow-lg transition-all ${progress === 100 ? 'opacity-60 grayscale-[40%]' : ''}`;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-semibold text-lg text-white truncate pr-2">${p.title}</h3>
              <div class="flex items-center gap-1">
                <button onclick="openModal('${p.id}')" title="Editar Proyecto" class="p-1.5 text-slate-400 hover:text-brand-400 transition">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                </button>
                <button onclick="deleteProject('${p.id}')" title="Eliminar Proyecto" class="p-1.5 text-slate-400 hover:text-rose-400 transition">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            ${p.video_url ? `
              <div class="rounded-xl overflow-hidden bg-black mb-4 max-h-48 flex items-center justify-center">
                <video src="${p.video_url}" controls class="w-full max-h-48 object-contain"></video>
              </div>
            ` : ''}

            <div class="mb-4">
              <div class="flex justify-between text-xs text-slate-400 mb-1">
                <span>Progreso</span>
                <span class="font-medium text-brand-400">${progress}%</span>
              </div>
              <div class="w-full bg-slate-700 rounded-full h-2">
                <div class="bg-brand-500 h-2 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
              </div>
            </div>

            <div class="space-y-2 mb-4">
              ${p.tasks ? p.tasks.map((task, idx) => `
                <div onclick="toggleTask('${p.id}',${idx})" class="flex items-center justify-between p-2.5 rounded-lg bg-slate-900/50 hover:bg-slate-900 transition cursor-pointer border border-slate-800">
                  <span class="text-sm ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${task.text}</span>
                  <div class="w-5 h-5 rounded-md border ${task.completed ? 'bg-brand-600 border-brand-500 flex items-center justify-center' : 'border-slate-600'}">
                    ${task.completed ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}
                  </div>
                </div>
              `).join('') : ''}
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    // Inicializar
    fetchProjects();
  </script>
</body>
</html>
