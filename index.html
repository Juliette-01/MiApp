<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Creator Studio Hub - Proyectos & Videos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b101d] text-slate-100 min-h-screen pb-24 font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0b101d]/90 border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="p-1.5 sm:p-2 bg-brand-600 rounded-xl">
          <i data-lucide="folder-kanban" class="w-4 h-4 sm:w-5 sm:h-5 text-white"></i>
        </div>
        <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent truncate">
          Creator Studio
        </h1>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="exportData()" title="Guardar respaldo" class="p-1.5 bg-[#171e31] hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-700/60 transition flex items-center gap-1 text-xs">
          <i data-lucide="download" class="w-4 h-4 text-brand-400"></i>
          <span class="hidden md:inline">Exportar</span>
        </button>
        
        <label title="Cargar respaldo" class="p-1.5 bg-[#171e31] hover:bg-slate-800 text-slate-300 rounded-lg border border-slate-700/60 transition flex items-center gap-1 text-xs cursor-pointer">
          <i data-lucide="upload" class="w-4 h-4 text-emerald-400"></i>
          <span class="hidden md:inline">Importar</span>
          <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
        </label>

        <button onclick="openProjectModal()" class="flex items-center gap-1 bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition shadow-lg shadow-brand-600/20">
          <i data-lucide="folder-plus" class="w-4 h-4"></i> <span>Nuevo Proyecto</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-6xl mx-auto px-3 sm:px-4 pt-4 sm:pt-6">
    
    <!-- BARRA DE PROGRESO GENERAL SUPREMA -->
    <div class="mb-6 bg-[#172033] border border-slate-700/50 p-4 rounded-2xl shadow-xl">
      <div class="flex justify-between items-center mb-1.5">
        <div>
          <h2 class="text-sm sm:text-base font-semibold text-white">Progreso General del Canal</h2>
          <p id="global-subtitle" class="text-[11px] sm:text-xs text-slate-400">0 de 0 tomas completadas</p>
        </div>
        <span id="global-percentage" class="text-lg sm:text-xl font-bold text-brand-400">0%</span>
      </div>
      <div class="w-full bg-[#0b101d] rounded-full h-2.5 sm:h-3 overflow-hidden border border-slate-700/50">
        <div id="global-progress-bar" class="bg-gradient-to-r from-violet-500 via-fuchsia-500 to-pink-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- LISTADO DE PROYECTOS PRINCIPALES -->
    <div id="projects-list" class="space-y-8"></div>
  </main>

  <!-- Modal 1: Nuevo / Editar Proyecto Principal -->
  <div id="project-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-[#172033] border border-slate-700/60 rounded-2xl p-5 w-full max-w-md shadow-2xl">
      <h2 id="project-modal-title" class="text-lg font-bold mb-4 text-white">Nuevo Proyecto</h2>
      <input type="hidden" id="edit-project-id">
      <div class="mb-4">
        <label class="block text-xs text-slate-400 mb-1">Nombre del Proyecto / Campaña</label>
        <input type="text" id="project-name-input" placeholder="Ej. Campaña Calzado Otoño / Reseñas TikTok" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-brand-500">
      </div>
      <div class="flex justify-end gap-3">
        <button onclick="closeProjectModal()" class="px-4 py-2 text-xs text-slate-400 hover:text-white">Cancelar</button>
        <button onclick="saveProjectGroup()" class="px-4 py-2 text-xs bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium">Guardar Proyecto</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Nuevo / Editar Video / Tomas -->
  <div id="video-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-[#172033] border border-slate-700/60 rounded-t-2xl sm:rounded-2xl p-5 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
      <h2 id="video-modal-title" class="text-lg font-bold mb-4 text-white">Agregar Video al Proyecto</h2>
      
      <input type="hidden" id="target-project-id">
      <input type="hidden" id="edit-video-id">
      
      <div class="space-y-3.5">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Título del Video / Escena</label>
          <input type="text" id="video-title-input" placeholder="Ej. Colocando botas / Caminando" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-brand-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">URL del Video de Referencia (MP4 / Web)</label>
          <input type="url" id="video-url-input" placeholder="https://ejemplo.com/video.mp4" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-xs sm:text-sm">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">O cargar video local (MP4)</label>
          <input type="file" id="video-file-input" accept="video/mp4,video/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-600 file:text-white hover:file:bg-brand-700 cursor-pointer">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Tomas / Checklist (Separadas por comas)</label>
          <textarea id="video-tasks-input" rows="3" placeholder="Toma principal, Outfit check, Calzado, Detalle" class="w-full bg-[#0b101d] border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 text-xs sm:text-sm"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-5">
        <button onclick="closeVideoModal()" class="px-4 py-2 text-xs sm:text-sm text-slate-400 hover:text-white">Cancelar</button>
        <button onclick="saveVideo()" class="px-4 py-2 text-xs sm:text-sm bg-brand-600 hover:bg-brand-700 text-white rounded-lg font-medium">Guardar Video</button>
      </div>
    </div>
  </div>

  <script>
    // Estructura de Datos:
    // mainProjects = [ { id, name, videos: [ { id, title, videoUrl, tasks: [{text, completed}] } ] } ]
    let mainProjects = JSON.parse(localStorage.getItem('juls_creator_main_projects')) || [
      {
        id: 'default-1',
        name: 'Proyecto Principal: Campaña de Calzado',
        videos: [
          {
            id: 'v1',
            title: 'Colocando botas',
            videoUrl: '',
            tasks: [{ text: 'Toma principal', completed: false }]
          },
          {
            id: 'v2',
            title: 'Caminando',
            videoUrl: '',
            tasks: [{ text: 'Toma principal', completed: false }]
          }
        ]
      }
    ];

    function saveToStorage() {
      localStorage.setItem('juls_creator_main_projects', JSON.stringify(mainProjects));
      renderApp();
    }

    // Modal de Proyecto Principal
    function openProjectModal(id = null) {
      document.getElementById('edit-project-id').value = id || '';
      document.getElementById('project-name-input').value = '';

      if (id) {
        const proj = mainProjects.find(p => p.id === id);
        if (proj) {
          document.getElementById('project-modal-title').innerText = "Editar Nombre del Proyecto";
          document.getElementById('project-name-input').value = proj.name;
        }
      } else {
        document.getElementById('project-modal-title').innerText = "Nuevo Proyecto Principal";
      }

      document.getElementById('project-modal').classList.remove('hidden');
    }

    function closeProjectModal() {
      document.getElementById('project-modal').classList.add('hidden');
    }

    function saveProjectGroup() {
      const id = document.getElementById('edit-project-id').value;
      const name = document.getElementById('project-name-input').value.trim();

      if (!name) return alert('Escribe un nombre para el proyecto.');

      if (id) {
        const proj = mainProjects.find(p => p.id === id);
        if (proj) proj.name = name;
      } else {
        mainProjects.push({
          id: Date.now().toString(),
          name: name,
          videos: []
        });
      }

      saveToStorage();
      closeProjectModal();
    }

    function deleteProjectGroup(id) {
      if (confirm('¿Segura que quieres eliminar este proyecto y todos sus videos?')) {
        mainProjects = mainProjects.filter(p => p.id !== id);
        saveToStorage();
      }
    }

    // Modal de Videos dentro de un Proyecto
    function openVideoModal(projId, videoId = null) {
      document.getElementById('target-project-id').value = projId;
      document.getElementById('edit-video-id').value = videoId || '';
      document.getElementById('video-title-input').value = '';
      document.getElementById('video-url-input').value = '';
      document.getElementById('video-tasks-input').value = '';
      document.getElementById('video-file-input').value = '';

      if (videoId) {
        const proj = mainProjects.find(p => p.id === projId);
        const vid = proj ? proj.videos.find(v => v.id === videoId) : null;
        if (vid) {
          document.getElementById('video-modal-title').innerText = "Editar Video";
          document.getElementById('video-title-input').value = vid.title;
          document.getElementById('video-url-input').value = vid.videoUrl && !vid.videoUrl.startsWith('data:') ? vid.videoUrl : '';
          document.getElementById('video-tasks-input').value = vid.tasks ? vid.tasks.map(t => t.text).join(', ') : '';
        }
      } else {
        document.getElementById('video-modal-title').innerText = "Agregar Video al Proyecto";
      }

      document.getElementById('video-modal').classList.remove('hidden');
    }

    function closeVideoModal() {
      document.getElementById('video-modal').classList.add('hidden');
    }

    function saveVideo() {
      const projId = document.getElementById('target-project-id').value;
      const vidId = document.getElementById('edit-video-id').value;
      const title = document.getElementById('video-title-input').value.trim();
      const videoUrl = document.getElementById('video-url-input').value.trim();
      const tasksText = document.getElementById('video-tasks-input').value.trim();
      const fileInput = document.getElementById('video-file-input');

      if (!title) return alert('Escribe el título del video.');

      let rawTasksList = tasksText.length > 0 
        ? tasksText.split(',').map(t => t.trim()).filter(t => t.length > 0)
        : ['Toma principal'];

      const processSave = (finalSrc) => {
        const proj = mainProjects.find(p => p.id === projId);
        if (!proj) return;

        if (vidId) {
          const vid = proj.videos.find(v => v.id === vidId);
          if (vid) {
            vid.title = title;
            vid.tasks = rawTasksList.map(taskText => {
              const existing = vid.tasks ? vid.tasks.find(t => t.text === taskText) : null;
              return existing ? existing : { text: taskText, completed: false };
            });
            if (finalSrc !== undefined) vid.videoUrl = finalSrc;
          }
        } else {
          proj.videos.push({
            id: Date.now().toString(),
            title: title,
            videoUrl: finalSrc || '',
            tasks: rawTasksList.map(t => ({ text: t, completed: false }))
          });
        }

        saveToStorage();
        closeVideoModal();
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          processSave(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        processSave(videoUrl || undefined);
      }
    }

    function toggleTask(projId, vidId, taskIndex) {
      const proj = mainProjects.find(p => p.id === projId);
      if (proj) {
        const vid = proj.videos.find(v => v.id === vidId);
        if (vid && vid.tasks && vid.tasks[taskIndex] !== undefined) {
          vid.tasks[taskIndex].completed = !vid.tasks[taskIndex].completed;
          saveToStorage();
        }
      }
    }

    function deleteVideo(projId, vidId) {
      if (confirm('¿Segura que quieres eliminar este video?')) {
        const proj = mainProjects.find(p => p.id === projId);
        if (proj) {
          proj.videos = proj.videos.filter(v => v.id !== vidId);
          saveToStorage();
        }
      }
    }

    // Exportar / Importar
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mainProjects, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `creator_studio_projects_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            mainProjects = imported;
            saveToStorage();
            alert('¡Proyectos importados con éxito!');
          }
        } catch (err) {
          alert('Error al leer el archivo.');
        }
      };
      reader.readAsText(file);
    }

    function renderApp() {
      const container = document.getElementById('projects-list');
      container.innerHTML = '';

      let totalGlobalTasks = 0;
      let completedGlobalTasks = 0;

      if (mainProjects.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-[#172033]/50 border border-slate-800 rounded-2xl">
            <i data-lucide="folder-open" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
            <p class="text-xs sm:text-sm text-slate-400">No tienes proyectos creados aún. Haz clic en "Nuevo Proyecto".</p>
          </div>
        `;
        document.getElementById('global-percentage').innerText = `0%`;
        document.getElementById('global-progress-bar').style.width = `0%`;
        document.getElementById('global-subtitle').innerText = `0 de 0 tomas completadas`;
        lucide.createIcons();
        return;
      }

      mainProjects.forEach(proj => {
        let projTasksTotal = 0;
        let projTasksDone = 0;

        proj.videos.forEach(v => {
          if (v.tasks) {
            projTasksTotal += v.tasks.length;
            projTasksDone += v.tasks.filter(t => t.completed).length;
          }
        });

        totalGlobalTasks += projTasksTotal;
        completedGlobalTasks += projTasksDone;

        const projProgress = projTasksTotal > 0 ? Math.round((projTasksDone / projTasksTotal) * 100) : 0;

        const projBlock = document.createElement('div');
        projBlock.className = "bg-[#111827]/80 border border-slate-800 rounded-3xl p-5 shadow-2xl";

        projBlock.innerHTML = `
          <!-- Cabecera del Proyecto Principal -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-5 border-b border-slate-800 gap-3">
            <div>
              <div class="flex items-center gap-2">
                <i data-lucide="folder" class="w-5 h-5 text-brand-400"></i>
                <h2 class="font-bold text-xl text-white">${proj.name}</h2>
                <span class="text-xs bg-brand-600/30 text-brand-300 px-2.5 py-0.5 rounded-full border border-brand-500/30">${projProgress}%</span>
              </div>
              <p class="text-xs text-slate-400 mt-1">${projTasksDone} de ${projTasksTotal} tomas de este proyecto completadas</p>
            </div>

            <div class="flex items-center gap-2">
              <button onclick="openVideoModal('${proj.id}')" class="flex items-center gap-1 text-xs bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg transition font-medium">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Agregar Video
              </button>
              <button onclick="openProjectModal('${proj.id}')" title="Editar Nombre Proyecto" class="p-1.5 text-slate-400 hover:text-white transition">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button onclick="deleteProjectGroup('${proj.id}')" title="Eliminar Proyecto" class="p-1.5 text-slate-400 hover:text-rose-400 transition">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Cuadrícula de Videos / Tomas del Proyecto -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${proj.videos.length > 0 ? proj.videos.map(v => `
              <div class="bg-[#172033] border border-slate-700/50 rounded-2xl p-4 sm:p-5 shadow-xl flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-lg text-white truncate pr-2">${v.title}</h3>
                    <div class="flex items-center gap-2">
                      <button onclick="openVideoModal('${proj.id}', '${v.id}')" title="Editar Video" class="text-slate-400 hover:text-white transition">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                      </button>
                      <button onclick="deleteVideo('${proj.id}', '${v.id}')" title="Eliminar Video" class="text-slate-400 hover:text-rose-400 transition">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>

                  ${v.videoUrl ? `
                    <div class="rounded-2xl overflow-hidden bg-black mb-4 flex items-center justify-center border border-slate-900/80 shadow-inner">
                      <video src="${v.videoUrl}" controls class="w-full max-h-[280px] object-contain"></video>
                    </div>
                  ` : ''}

                  <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">TOMAS / CHECKLIST</p>
                    <div class="space-y-2">
                      ${v.tasks ? v.tasks.map((task, idx) => `
                        <div onclick="toggleTask('${proj.id}', '${v.id}', ${idx})" class="flex items-center justify-between p-2.5 rounded-xl bg-[#0b101d]/60 hover:bg-[#0b101d] transition cursor-pointer border border-slate-800/80">
                          <span class="text-xs sm:text-sm ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${task.text}</span>
                          <div class="w-5 h-5 rounded-md border ${task.completed ? 'bg-brand-600 border-brand-500 flex items-center justify-center' : 'border-slate-600/80'}">
                            ${task.completed ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white"></i>' : ''}
                          </div>
                        </div>
                      `).join('') : ''}
                    </div>
                  </div>
                </div>
              </div>
            `).join('') : `
              <div class="col-span-full text-center py-6 border border-dashed border-slate-800 rounded-xl text-slate-500 text-xs">
                No hay videos en este proyecto. Toca "Agregar Video" arriba.
              </div>
            `}
          </div>
        `;

        container.appendChild(projBlock);
      });

      // Actualizar Barra Global
      const globalPercentage = totalGlobalTasks > 0 ? Math.round((completedGlobalTasks / totalGlobalTasks) * 100) : 0;
      document.getElementById('global-percentage').innerText = `${globalPercentage}%`;
      document.getElementById('global-progress-bar').style.width = `${globalPercentage}%`;
      document.getElementById('global-subtitle').innerText = `${completedGlobalTasks} de ${totalGlobalTasks} tomas completadas`;

      lucide.createIcons();
    }

    renderApp();
  </script>
</body>
</html>
